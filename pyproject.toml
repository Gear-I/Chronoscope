[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chronoscope-forensics"
dynamic = ["version"]
description = "Forensically sound unified timeline builder for digital forensic examiners"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Dielle De Noon" }]
keywords = ["dfir", "forensics", "timeline", "incident-response", "timesketch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["click>=8.1"]

[project.optional-dependencies]
evtx = ["python-evtx>=0.8"]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "ruff>=0.5", "python-evtx>=0.8", "PySide6>=6.6"]

[project.scripts]
chronoscope = "chronoscope.cli:main"

[tool.setuptools.dynamic]
version = { attr = "chronoscope.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chronoscope = ["resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]
